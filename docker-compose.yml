name: intelligent-customer-service

x-app-env: &app-env
  TENANT_ID: ${TENANT_ID:-Influencer}
  KB_ID: ${KB_ID:-Influencer_knowlege}
  DB_ID: ${DB_ID:-erp}
  RESPONSE_CACHE_PREFIX: ${RESPONSE_CACHE_PREFIX:-customer_service}
  RESPONSE_CACHE_TTL: ${RESPONSE_CACHE_TTL:-1800}
  RESPONSE_CACHE_SHORT_TTL: ${RESPONSE_CACHE_SHORT_TTL:-300}
  HISTORY_MAX_MESSAGES: ${HISTORY_MAX_MESSAGES:-20}
  MAX_CLARIFICATION_ROUNDS: ${MAX_CLARIFICATION_ROUNDS:-2}

  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}

  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
  HF_HOME: /models/hf_cache
  HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
  TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}

  MILVUS_HOST: milvus
  MILVUS_PORT: "19530"
  MILVUS_USER: ${MILVUS_USER:-}
  MILVUS_PASSWORD: ${MILVUS_PASSWORD:-}
  MILVUS_SECURE: "false"
  MILVUS_DB: ${MILVUS_DB:-}
  MILVUS_TEXT_COLLECTION: ${MILVUS_TEXT_COLLECTION:-mushroom_knowledge}
  MILVUS_DIM: ${MILVUS_DIM:-512}
  MILVUS_OUTPUT_FIELDS: ${MILVUS_OUTPUT_FIELDS:-id,content,source,category,parent_id,chunk_index,tenant_id,kb_id,doc_version}

  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_test}
  MYSQL_USER: ${MYSQL_USER:-root}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
  MYSQL_CHARSET: utf8mb4
  MYSQL_CONNECT_TIMEOUT: "3"
  MYSQL_READ_TIMEOUT: "5"
  MYSQL_POOL_MAX_CONNECTIONS: "10"
  RAG_PARENT_TABLE: ${RAG_PARENT_TABLE:-rag_parent_block}
  RAG_PARENT_STATUS: ${RAG_PARENT_STATUS:-active}

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_DEFAULT_TTL: ${REDIS_DEFAULT_TTL:-1800}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-rag}
  REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT:-3}

  RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
  RETRIEVAL_MIN_RELEVANCE: ${RETRIEVAL_MIN_RELEVANCE:-0}
  RETRIEVAL_HYBRID_WORKERS: ${RETRIEVAL_HYBRID_WORKERS:-16}
  RRF_TOP_K: ${RRF_TOP_K:-20}
  RRF_K: ${RRF_K:-60}
  RERANK_TOP_K: ${RERANK_TOP_K:-3}
  RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
  RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
  CONTEXT_MAX_TOKENS: ${CONTEXT_MAX_TOKENS:-6000}
  MAX_DOC_TOKENS: ${MAX_DOC_TOKENS:-3000}
  RETRIEVAL_QUERY_REWRITE_MODE: ${RETRIEVAL_QUERY_REWRITE_MODE:-off}

  NL2SQL_LLM_BASE_URL: ${NL2SQL_LLM_BASE_URL:-}
  NL2SQL_LLM_API_KEY: ${NL2SQL_LLM_API_KEY:-}
  NL2SQL_LLM_MODEL: ${NL2SQL_LLM_MODEL:-}
  NL2SQL_LLM_TEMPERATURE: ${NL2SQL_LLM_TEMPERATURE:-0}
  NL2SQL_LLM_MAX_TOKENS: ${NL2SQL_LLM_MAX_TOKENS:-2048}
  NL2SQL_LLM_TIMEOUT_SECONDS: ${NL2SQL_LLM_TIMEOUT_SECONDS:-30}
  NL2SQL_DB_ERP_DSN: mysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-change-me}@mysql:3306/commerce
  NL2SQL_DB_ERP_SERVER_VERSION: ${NL2SQL_DB_ERP_SERVER_VERSION:-8.0}
  NL2SQL_DB_ERP_VISIBLE_TABLES: ${NL2SQL_DB_ERP_VISIBLE_TABLES:-}
  NL2SQL_SEMANTIC_DIR: /app/components/nl2sql_skill/semantic
  NL2SQL_EXAMPLE_STORE_PATH: /app/components/nl2sql_skill/examples/few_shots/samples.jsonl
  NL2SQL_CLARIFY_THRESHOLD: ${NL2SQL_CLARIFY_THRESHOLD:-0.75}
  NL2SQL_MAX_ROWS: ${NL2SQL_MAX_ROWS:-200}
  NL2SQL_HISTORY_MAX_TOKENS: ${NL2SQL_HISTORY_MAX_TOKENS:-2000}
  NL2SQL_SCHEMA_CONTEXT_MAX_TOKENS: ${NL2SQL_SCHEMA_CONTEXT_MAX_TOKENS:-4000}
  NL2SQL_TOP_K_TABLES: ${NL2SQL_TOP_K_TABLES:-8}
  NL2SQL_EXAMPLE_MIN_SIMILARITY: ${NL2SQL_EXAMPLE_MIN_SIMILARITY:-0.75}
  NL2SQL_EXECUTOR_ENABLED: ${NL2SQL_EXECUTOR_ENABLED:-true}
  NL2SQL_COST_GUARD_ENABLED: ${NL2SQL_COST_GUARD_ENABLED:-false}
  NL2SQL_COST_THRESHOLD_ROWS: ${NL2SQL_COST_THRESHOLD_ROWS:-5000000}
  NL2SQL_EXPLAIN_FAIL_POLICY: ${NL2SQL_EXPLAIN_FAIL_POLICY:-deny}
  NL2SQL_SQL_CACHE_ENABLED: ${NL2SQL_SQL_CACHE_ENABLED:-true}
  NL2SQL_SQL_CACHE_TTL_SECONDS: ${NL2SQL_SQL_CACHE_TTL_SECONDS:-86400}
  NL2SQL_CACHE_KEY_INCLUDE_HISTORY: ${NL2SQL_CACHE_KEY_INCLUDE_HISTORY:-false}

  AUTH_MODE: ${AUTH_MODE:-disabled}
  METRICS_ENABLED: ${METRICS_ENABLED:-false}
  METRICS_PREFIX: ${METRICS_PREFIX:-customer_service}
  METRICS_PORT: ${METRICS_PORT:-9090}
  METRICS_BIND: ${METRICS_BIND:-0.0.0.0}
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: ics-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: ics-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address :9001
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: ics-milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    command: milvus run standalone
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT_HOST:-127.0.0.1:19531}:19530"
      - "${MILVUS_METRIC_PORT_HOST:-127.0.0.1:9092}:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  attu:
    image: zilliz/attu:v2.4
    container_name: ics-milvus-attu
    ports:
      - "${ATTU_PORT_HOST:-127.0.0.1:8002}:3000"
    depends_on:
      - milvus

  redis:
    image: redis:7-alpine
    container_name: ics-redis
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT_HOST:-127.0.0.1:6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: ics-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_DATABASE: commerce
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT_HOST:-127.0.0.1:3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  milvus-seed:
    image: ${APP_IMAGE:-ghcr.io/pnj-star/intelligent-customer-service:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ics-milvus-seed
    command: ["python", "docker/milvus/bootstrap_milvus.py"]
    environment:
      <<: *app-env
    depends_on:
      milvus:
        condition: service_started
    restart: "no"

  app:
    image: ${APP_IMAGE:-ghcr.io/pnj-star/intelligent-customer-service:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ics-app
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "${APP_PORT_HOST:-127.0.0.1:8000}:8000"
    volumes:
      - hf_cache:/models/hf_cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus-seed:
        condition: service_completed_successfully

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
  mysql_data:
  hf_cache:
